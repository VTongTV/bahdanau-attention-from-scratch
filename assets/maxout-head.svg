<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="mxhd-t mxhd-d">
<title id="mxhd-t">maxout deep output head</title>
<desc id="mxhd-d">the head is a deep output. the pre-activation tensor has 2l = 1000 units. it is parsed as 500 adjacent pairs. a max-pool bracket sweeps over the pairs and picks the larger of each. that gives 500 units. W_o then projects to 30000 logits. softmax gives the next-word distribution.</desc>

<defs>
  <radialGradient id="mxhd-bgH" cx="40%" cy="30%" r="85%"><stop offset="0%" stop-color="#15171C"/><stop offset="100%" stop-color="#08090C"/></radialGradient>
  <pattern id="mxhd-gridH" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1B1F26"/></pattern>
  <linearGradient id="mxhd-barH" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#0A6B3F"/><stop offset="100%" stop-color="#04E762"/></linearGradient>
  <linearGradient id="mxhd-steelH" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3C424D"/><stop offset="100%" stop-color="#191C23"/></linearGradient>
  <filter id="mxhd-glH" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="mxhd-agH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#04E762"/></marker>
  <marker id="mxhd-arH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8998"/></marker>
</defs>

<rect width="1000" height="640" fill="url(#mxhd-bgH)"/>
<rect width="1000" height="640" fill="url(#mxhd-gridH)"/>
<text x="40" y="36" fill="#E8E6E3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold">maxout deep output - 2l to l, then project to vocab</text>
<text x="40" y="58" fill="#6E747D" font-family="Arial, Helvetica, sans-serif" font-size="12">the pre-activation stacks the three sums. adjacent pairs max-pool into l units, then W_o maps to the 30000 shortlist.</text>

<g font-family="Arial, Helvetica, sans-serif">
  <text x="60" y="92" fill="#7C8998" font-size="11">inputs at decoder step i</text>
  <rect x="60" y="100" width="160" height="40" rx="5" fill="url(#mxhd-steelH)" stroke="#5A6270"/>
  <text x="140" y="124" fill="#E8E6E3" font-size="13" text-anchor="middle">u_o s_{i-1}</text>
  <text x="228" y="124" fill="#6E747D" font-size="10">n = 1000</text>

  <rect x="60" y="150" width="160" height="40" rx="5" fill="url(#mxhd-steelH)" stroke="#5A6270"/>
  <text x="140" y="174" fill="#E8E6E3" font-size="13" text-anchor="middle">v_o e(y_{i-1})</text>
  <text x="228" y="174" fill="#6E747D" font-size="10">m = 620</text>

  <rect x="60" y="200" width="160" height="40" rx="5" fill="#0E8F52" stroke="#04E762" stroke-width="1.2"/>
  <text x="140" y="224" fill="#E8E6E3" font-size="13" text-anchor="middle">c_o c_i</text>
  <text x="228" y="224" fill="#04E762" font-size="10">2n = 2000</text>

  <text x="60" y="262" fill="#7C8998" font-size="11">sum -> u_o s + v_o e + c_o c</text>
  <line x1="220" y1="120" x2="280" y2="280" stroke="#7C8998" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="220" y1="170" x2="280" y2="280" stroke="#7C8998" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="220" y1="220" x2="280" y2="280" stroke="#04E762" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="300" y="92" fill="#7C8998" font-size="11">pre-activation  2l = 1000</text>
  <rect x="300" y="100" width="220" height="380" rx="6" fill="#101319" stroke="#5A6270" stroke-width="1.2"/>
  <line x1="220" y1="290" x2="300" y2="290" stroke="#5A6270" stroke-width="1.4" marker-end="url(#mxhd-arH)"/>

  <g fill="url(#mxhd-barH)" stroke="#0A6B3F" stroke-width="0.8">
    <rect x="312" y="118" width="40" height="0"><animate attributeName="height" values="20;8;30;14;24" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="460;472;450;466;456" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="312" y="118" width="40" height="0" opacity="0.7"><animate attributeName="height" values="30;4;22;38;14" dur="2.4s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y" values="450;476;458;442;466" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="312" y="118" width="40" height="0"><animate attributeName="height" values="38;20;4;28;18" dur="2.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="442;460;476;452;462" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="312" y="118" width="40" height="0" opacity="0.7"><animate attributeName="height" values="14;30;18;6;36" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="466;450;462;474;444" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="312" y="118" width="40" height="0"><animate attributeName="height" values="22;36;10;30;8" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="458;444;470;450;472" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="312" y="118" width="40" height="0" opacity="0.7"><animate attributeName="height" values="6;14;28;18;30" dur="2.4s" begin="1s" repeatCount="indefinite"/><animate attributeName="y" values="474;466;452;462;450" dur="2.4s" begin="1s" repeatCount="indefinite"/></rect>
  </g>

  <text x="406" y="118" fill="#7C8998" font-size="11" text-anchor="middle">2l stacked pairs (top of each pair is darker)</text>
  <text x="406" y="498" fill="#7C8998" font-size="11" text-anchor="middle">pair 1 - pair 2 - pair 3 - ... - pair 500</text>

  <rect x="538" y="120" width="80" height="40" rx="3" fill="#04E762" opacity="0">
    <animate attributeName="opacity" values="0;0.18;0.18;0.18;0" keyTimes="0;0.08;0.5;0.92;1" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="x" values="300;518;300" keyTimes="0;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="120;460;120" keyTimes="0;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <text x="300" y="510" fill="#04E762" font-size="11">max-pool bracket sweeps adjacent pairs</text>
  <line x1="538" y1="290" x2="600" y2="290" stroke="#04E762" stroke-width="2" marker-end="url(#mxhd-agH)"/>

  <text x="620" y="92" fill="#7C8998" font-size="11">pooled  l = 500</text>
  <rect x="620" y="100" width="200" height="380" rx="6" fill="#101319" stroke="#04E762" stroke-width="1.2" filter="url(#mxhd-glH)"/>
  <g fill="url(#mxhd-barH)" stroke="#0A6B3F" stroke-width="0.8">
    <rect x="632" y="118" width="40" height="0"><animate attributeName="height" values="30;22;30;38;30" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="462;470;462;450;462" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="632" y="118" width="40" height="0"><animate attributeName="height" values="22;30;22;38;22" dur="2.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="470;462;470;454;470" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="632" y="118" width="40" height="0"><animate attributeName="height" values="38;36;30;30;36" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="454;456;462;462;456" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></rect>
  </g>
  <text x="720" y="498" fill="#7C8998" font-size="11" text-anchor="middle">max of each pair</text>

  <text x="620" y="510" fill="#04E762" font-size="11">W_o projects l = 500 -> V = 30000</text>
  <line x1="820" y1="290" x2="858" y2="290" stroke="#04E762" stroke-width="2" marker-end="url(#mxhd-agH)"/>

  <text x="860" y="92" fill="#7C8998" font-size="11">logits + softmax</text>
  <rect x="860" y="100" width="110" height="380" rx="6" fill="#101319" stroke="#04E762" stroke-width="1.4" filter="url(#mxhd-glH)"/>
  <g fill="url(#mxhd-barH)">
    <rect x="866" y="118" width="11" height="0"><animate attributeName="height" values="26;6;36;2;26" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="454;474;444;478;454" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="879" y="118" width="11" height="0"><animate attributeName="height" values="8;22;4;30;8" dur="2.4s" begin="0.1s" repeatCount="indefinite"/><animate attributeName="y" values="472;454;482;470;472" dur="2.4s" begin="0.1s" repeatCount="indefinite"/></rect>
    <rect x="892" y="118" width="11" height="0"><animate attributeName="height" values="2;8;14;4;2" dur="2.4s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y" values="478;470;464;476;478" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="905" y="118" width="11" height="0"><animate attributeName="height" values="36;14;2;22;6" dur="2.4s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="444;466;478;454;472" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="918" y="118" width="11" height="0"><animate attributeName="height" values="4;16;8;2;10" dur="2.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="476;464;470;478;468" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="931" y="118" width="11" height="0"><animate attributeName="height" values="10;4;18;6;14" dur="2.4s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="y" values="468;476;462;472;464" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></rect>
    <rect x="944" y="118" width="11" height="0"><animate attributeName="height" values="6;22;4;32;2" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="472;456;476;450;478" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="957" y="468" width="11" height="2" opacity="0.7"><animate attributeName="height" values="8;30;6;4;12" dur="2.4s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="y" values="470;452;470;476;466" dur="2.4s" begin="0.7s" repeatCount="indefinite"/></rect>
  </g>
  <text x="910" y="498" fill="#7C8998" font-size="11" text-anchor="middle">30k softmax</text>

  <text x="40" y="528" fill="#E8E6E3" font-size="14" font-weight="bold">why a deep output</text>
  <text x="40" y="550" fill="#7C8998" font-size="12">- one linear map to 30000 logits is too shallow; cross-entropy acts on a flat slab of softmax.</text>
  <text x="40" y="570" fill="#7C8998" font-size="12">- maxout learns the non-linearity itself: each pair picks the max, like a learned relu on demand.</text>
  <text x="40" y="590" fill="#7C8998" font-size="12">- 2l -> l halves the depth, doubles the width, and stays differentiable without extra weights.</text>
  <text x="40" y="610" fill="#7C8998" font-size="12">- granularity 500 - vocab 30000 still doubles parameters over a plain softmax head.</text>
</g>
</svg>
