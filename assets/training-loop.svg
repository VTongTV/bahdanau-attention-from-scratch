<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="tr-t tr-d">
<title id="tr-t">training loop - one sgd step with adadelta</title>
<desc id="tr-d">one update step. the model runs forward. gradients flow back. the gradient vector grows past the green unit-norm circle. clip scales it back to the circle's edge. adadelta rescales using a running rho=0.95 accumulator. the update goes to the params. a clock at the bottom ticks 20 times then re-buckets.</desc>

<defs>
  <radialGradient id="tr-bg" cx="40%" cy="30%" r="85%"><stop offset="0%" stop-color="#15171C"/><stop offset="100%" stop-color="#08090C"/></radialGradient>
  <pattern id="tr-grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1B1F26"/></pattern>
  <linearGradient id="tr-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3C424D"/><stop offset="100%" stop-color="#191C23"/></linearGradient>
  <linearGradient id="tr-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#04E762"/><stop offset="100%" stop-color="#0A6B3F"/></linearGradient>
  <radialGradient id="tr-pulse" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#04E762" stop-opacity="0.85"/><stop offset="100%" stop-color="#04E762" stop-opacity="0"/></radialGradient>
  <filter id="tr-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="tr-crim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C22B3F"/></marker>
  <marker id="tr-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#04E762"/></marker>
  <marker id="tr-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8998"/></marker>
</defs>

<rect width="1280" height="640" fill="url(#tr-bg)"/>
<rect width="1280" height="640" fill="url(#tr-grid)"/>
<text x="48" y="38" fill="#E8E6E3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold">training loop - one sgd step with adadelta and re-bucketing</text>
<text x="48" y="60" fill="#6E747D" font-family="Arial, Helvetica, sans-serif" font-size="12">forward, backward, gradient grows past the unit-norm circle, clip brings it back, adadelta rescales, params update, then every 20 steps re-bucket.</text>

<g font-family="Arial, Helvetica, sans-serif">
  <text x="48" y="92" fill="#7C8998" font-size="11">forward pass</text>
  <rect x="48" y="100" width="160" height="120" rx="8" fill="#101319" stroke="#5A6270" stroke-width="1.2"/>
  <text x="128" y="142" fill="#E8E6E3" font-size="13" text-anchor="middle">forward</text>
  <text x="128" y="162" fill="#6E747D" font-size="10" text-anchor="middle">logits - nll loss</text>
  <text x="128" y="178" fill="#6E747D" font-size="10" text-anchor="middle">batch of 80</text>
  <text x="128" y="194" fill="#04E762" font-size="10" text-anchor="middle">avg over batch</text>

  <text x="224" y="92" fill="#7C8998" font-size="11">backward pass</text>
  <rect x="224" y="100" width="160" height="120" rx="8" fill="#101319" stroke="#5A6270" stroke-width="1.2"/>
  <text x="304" y="142" fill="#E8E6E3" font-size="13" text-anchor="middle">backward</text>
  <text x="304" y="162" fill="#6E747D" font-size="10" text-anchor="middle">autograd of nll</text>
  <text x="304" y="178" fill="#6E747D" font-size="10" text-anchor="middle">grads per param</text>
  <text x="304" y="194" fill="#C22B3F" font-size="10" text-anchor="middle">may be large</text>

  <text x="400" y="92" fill="#7C8998" font-size="11">gradient norm</text>
  <rect x="400" y="100" width="200" height="120" rx="8" fill="#101319" stroke="#5A6270" stroke-width="1.2"/>
  <text x="500" y="124" fill="#6E747D" font-size="10" text-anchor="middle">||g||_2 vs clip-norm = 1.0</text>

  <line x1="430" y1="180" x2="430" y2="180" stroke="#C22B3F" stroke-width="3" marker-end="url(#tr-crim)" opacity="0">
    <animate attributeName="x2" values="430;680" dur="0.3s" begin="0s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.25" begin="0.35s" dur="0.05s" fill="freeze"/>
    <animate attributeName="x2" values="680;560" begin="0.35s" dur="0.1s" fill="freeze"/>
  </line>
  <text x="430" y="200" fill="#6E747D" font-size="9">crimson arrow grows, then clip scales it back into the green circle</text>

  <line x1="640" y1="120" x2="640" y2="200" stroke="#04E762" stroke-width="1" stroke-dasharray="2 3" opacity="0">
    <animate attributeName="opacity" values="0;0.6" begin="0.45s" dur="0.1s" fill="freeze"/>
  </line>

  <line x1="692" y1="160" x2="692" y2="160" stroke="#04E762" stroke-width="2.4" marker-end="url(#tr-ag)" opacity="0">
    <animate attributeName="x1" values="600;680" begin="0.55s" dur="0.1s" fill="freeze"/>
    <animate attributeName="x2" values="600;870" begin="0.55s" dur="0.1s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1" begin="0.55s" dur="0.1s" fill="freeze"/>
  </line>

  <rect x="484" y="156" width="90" height="40" rx="6" fill="#0E8F52" stroke="#04E762" stroke-width="1" opacity="0.18">
    <animate attributeName="opacity" values="0.18" dur="0.001s" fill="freeze"/>
  </rect>
  <circle cx="640" cy="160" r="48" fill="none" stroke="#04E762" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="640" y="164" fill="#04E762" font-size="10" text-anchor="middle">||g|| = 1</text>
  <text x="640" y="178" fill="#04E762" font-size="9" text-anchor="middle">clip-norm</text>

  <text x="692" y="92" fill="#7C8998" font-size="11">clip</text>
  <rect x="692" y="100" width="180" height="120" rx="8" fill="#101319" stroke="#5A6270" stroke-width="1.2"/>
  <text x="782" y="142" fill="#E8E6E3" font-size="13" text-anchor="middle">clip to unit</text>
  <text x="782" y="162" fill="#6E747D" font-size="10" text-anchor="middle">if ||g|| > 1,</text>
  <text x="782" y="178" fill="#6E747D" font-size="10" text-anchor="middle">g := g / ||g||</text>
  <text x="782" y="194" fill="#6E747D" font-size="10" text-anchor="middle">else leave as-is</text>

  <text x="884" y="92" fill="#7C8998" font-size="11">adadelta  rho=0.95  eps=1e-6</text>
  <rect x="884" y="100" width="200" height="120" rx="8" fill="#101319" stroke="#5A6270" stroke-width="1.2"/>
  <text x="984" y="142" fill="#E8E6E3" font-size="13" text-anchor="middle">adadelta</text>
  <text x="984" y="162" fill="#6E747D" font-size="10" text-anchor="middle">E[g^2] := rho E[g^2]</text>
  <text x="984" y="178" fill="#6E747D" font-size="10" text-anchor="middle">           + (1-rho) g^2</text>
  <text x="984" y="194" fill="#6E747D" font-size="10" text-anchor="middle">no learning rate</text>

  <text x="1096" y="92" fill="#7C8998" font-size="11">param update</text>
  <rect x="1096" y="100" width="140" height="120" rx="8" fill="#101319" stroke="#04E762" stroke-width="1.4" filter="url(#tr-glow)"/>
  <text x="1166" y="142" fill="#E8E6E3" font-size="13" text-anchor="middle">theta</text>
  <text x="1166" y="162" fill="#6E747D" font-size="10" text-anchor="middle">theta := theta - delta</text>
  <text x="1166" y="178" fill="#04E762" font-size="10" text-anchor="middle">done step k</text>

  <line x1="208" y1="222" x2="208" y2="100" stroke="#7C8998" stroke-width="1.2"/>
  <line x1="208" y1="160" x2="224" y2="160" stroke="#7C8998" stroke-width="1.2" marker-end="url(#tr-ar)"/>
  <line x1="384" y1="160" x2="400" y2="160" stroke="#7C8998" stroke-width="1.2" marker-end="url(#tr-ar)"/>
  <line x1="600" y1="160" x2="692" y2="160" stroke="#7C8998" stroke-width="1.2" marker-end="url(#tr-ar)"/>
  <line x1="872" y1="160" x2="884" y2="160" stroke="#7C8998" stroke-width="1.2" marker-end="url(#tr-ar)"/>
  <line x1="1084" y1="160" x2="1096" y2="160" stroke="#04E762" stroke-width="1.2" marker-end="url(#tr-ag)"/>

  <text x="48" y="276" fill="#7C8998" font-size="11">rebucket clock - every 20 updates, fetch 1600 pairs, sort by length, cut 20 batches</text>
  <g stroke="#3A4049" stroke-width="0.8" fill="url(#tr-steel)">
    <rect x="48" y="284" width="32" height="20" rx="2"/>
    <rect x="84" y="284" width="32" height="20" rx="2"/>
    <rect x="120" y="284" width="32" height="20" rx="2"/>
    <rect x="156" y="284" width="32" height="20" rx="2"/>
    <rect x="192" y="284" width="32" height="20" rx="2"/>
    <rect x="228" y="284" width="32" height="20" rx="2"/>
    <rect x="264" y="284" width="32" height="20" rx="2"/>
    <rect x="300" y="284" width="32" height="20" rx="2"/>
    <rect x="336" y="284" width="32" height="20" rx="2"/>
    <rect x="372" y="284" width="32" height="20" rx="2"/>
    <rect x="408" y="284" width="32" height="20" rx="2"/>
    <rect x="444" y="284" width="32" height="20" rx="2"/>
    <rect x="480" y="284" width="32" height="20" rx="2"/>
    <rect x="516" y="284" width="32" height="20" rx="2"/>
    <rect x="552" y="284" width="32" height="20" rx="2"/>
    <rect x="588" y="284" width="32" height="20" rx="2"/>
    <rect x="624" y="284" width="32" height="20" rx="2"/>
    <rect x="660" y="284" width="32" height="20" rx="2"/>
    <rect x="696" y="284" width="32" height="20" rx="2"/>
    <rect x="732" y="284" width="32" height="20" rx="2"/>
  </g>
  <rect x="732" y="284" width="32" height="20" rx="2" fill="#04E762" opacity="0.9" filter="url(#tr-glow)">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="748" y="320" fill="#04E762" font-size="10" text-anchor="middle">rebucket here (step k=20)</text>
  <text x="180" y="320" fill="#6E747D" font-size="10">ticks 1..20 (one sgd step each)</text>

  <rect x="48" y="262" width="32" height="2" rx="1" fill="#04E762" opacity="0">
    <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.05;0.9;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="48;84;120;156;192;228;264;300;336;372;408;444;480;516;552;588;624;660;696;732;48" keyTimes="0;0.05;0.10;0.15;0.20;0.25;0.30;0.35;0.40;0.45;0.50;0.55;0.60;0.65;0.70;0.75;0.80;0.85;0.90;0.95;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="48" y="252" fill="#04E762" font-size="9" opacity="0">tick marker marches across the clock, one step at a time, and re-buckets at step 20
    <animate attributeName="opacity" values="0;0.95" begin="0.05s" dur="0.1s" fill="freeze"/>
    <animate attributeName="opacity" values="0.95" begin="0.05s" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="48" y="372" fill="#E8E6E3" font-size="14" font-weight="bold">why each part</text>
  <text x="48" y="394" fill="#7C8998" font-size="12">- plain sgd shook apart gru states at long sources. clip holds the norm at 1 when grads explode.</text>
  <text x="48" y="414" fill="#7C8998" font-size="12">- adadelta keeps a running rho=0.95 squared-gradient sum per weight. no learning rate to tune.</text>
  <text x="48" y="434" fill="#7C8998" font-size="12">- bucketing by length caps padding waste. fetch 1600 pairs, sort, cut 20 batches of 80.</text>
  <text x="48" y="454" fill="#7C8998" font-size="12">- the schedule re-buckets every 20th update; the rest of the time the data is walked in order.</text>

  <text x="48" y="486" fill="#E8E6E3" font-size="14" font-weight="bold">paper training stats (table 2)</text>
  <text x="48" y="508" fill="#7C8998" font-size="12">- rnnsearch-30: 4.71e5 updates, 3.6 epochs, 113 hours on titan black. train nll 26.7, dev nll 47.2.</text>
  <text x="48" y="528" fill="#7C8998" font-size="12">- rnnsearch-50*: 6.67e5 updates, 5.0 epochs, 252 hours on quadro k-6000. train nll 36.7, dev nll 35.2.</text>
  <text x="48" y="548" fill="#6E747D" font-size="11">our runs are small scale on cpu; the recipe is identical.</text>

</g>
</svg>
