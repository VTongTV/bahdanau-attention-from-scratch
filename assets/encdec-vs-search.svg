<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="vs-t vs-d">
<title id="vs-t">rnnencdec vs rnnsearch - fixed context vs per-step attention</title>
<desc id="vs-d">top: rnnencdec uses a single frozen context vector taken from the last encoder state. it is the same c for every decoder step. bottom: rnnsearch computes a fresh context c_i at each step by attending to different source positions. this is the paper's thesis.</desc>

<defs>
  <radialGradient id="vs-bg" cx="40%" cy="30%" r="85%"><stop offset="0%" stop-color="#15171C"/><stop offset="100%" stop-color="#08090C"/></radialGradient>
  <pattern id="vs-grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1B1F26"/></pattern>
  <linearGradient id="vs-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3C424D"/><stop offset="100%" stop-color="#191C23"/></linearGradient>
  <linearGradient id="vs-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#04E762"/><stop offset="100%" stop-color="#0A6B3F"/></linearGradient>
  <filter id="vs-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="vs-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5A6270"/></marker>
  <marker id="vs-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#04E762"/></marker>
  <marker id="vs-crim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C22B3F"/></marker>
</defs>

<rect width="1280" height="640" fill="url(#vs-bg)"/>
<rect width="1280" height="640" fill="url(#vs-grid)"/>
<text x="48" y="38" fill="#E8E6E3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold">rnnencdec vs rnnsearch - the whole paper in one contrast</text>
<text x="48" y="60" fill="#6E747D" font-family="Arial, Helvetica, sans-serif" font-size="12">top: one frozen context from the last encoder state, never changes. bottom: a fresh context per step, the attention picks which source words matter now.</text>

<g font-family="Arial, Helvetica, sans-serif">
  <rect x="48" y="76" width="1184" height="240" rx="10" fill="#101319" stroke="#5A6270" stroke-width="1.2"/>
  <text x="68" y="100" fill="#7C8998" font-size="14">rnnencdec (baseline) - fixed context</text>

  <g fill="url(#vs-steel)" stroke="#5A6270" stroke-width="1">
    <rect x="68" y="114" width="68" height="34" rx="4"/><text x="102" y="136" fill="#E8E6E3" font-size="10" text-anchor="middle">the</text>
    <rect x="142" y="114" width="68" height="34" rx="4"/><text x="176" y="136" fill="#E8E6E3" font-size="10" text-anchor="middle">man</text>
    <rect x="216" y="114" width="68" height="34" rx="4"/><text x="250" y="136" fill="#E8E6E3" font-size="10" text-anchor="middle">loves</text>
    <rect x="290" y="114" width="68" height="34" rx="4"/><text x="324" y="136" fill="#E8E6E3" font-size="10" text-anchor="middle">the</text>
    <rect x="364" y="114" width="68" height="34" rx="4"/><text x="398" y="136" fill="#E8E6E3" font-size="10" text-anchor="middle">dog</text>
    <rect x="438" y="114" width="68" height="34" rx="4"/><text x="472" y="136" fill="#7C8998" font-size="10" text-anchor="middle">EOS</text>
  </g>
  <text x="68" y="168" fill="#6E747D" font-size="10">encoder reads all words, only the last hidden state is used as context</text>

  <line x1="472" y1="148" x2="640" y2="200" stroke="#5A6270" stroke-width="2.4" marker-end="url(#vs-ar)"/>
  <rect x="640" y="182" width="180" height="44" rx="6" fill="url(#vs-steel)" stroke="#5A6270" stroke-width="1.8"/>
  <text x="730" y="208" fill="#7C8998" font-size="14" text-anchor="middle">c (frozen)</text>
  <text x="730" y="222" fill="#6E747D" font-size="9" text-anchor="middle">same vector at every step</text>

  <rect x="880" y="182" width="180" height="44" rx="6" fill="#101319" stroke="#5A6270"/>
  <text x="970" y="208" fill="#E8E6E3" font-size="13" text-anchor="middle">decoder gru</text>
  <line x1="820" y1="204" x2="880" y2="204" stroke="#5A6270" stroke-width="1.4" marker-end="url(#vs-ar)"/>

  <g stroke="#5A6270" stroke-width="1" stroke-dasharray="3 4" opacity="0.4">
    <line x1="640" y1="226" x2="640" y2="276"/>
    <line x1="730" y1="226" x2="730" y2="276"/>
    <line x1="820" y1="226" x2="820" y2="276"/>
  </g>
  <g fill="#7C8998" font-size="10" text-anchor="middle">
    <text x="730" y="290">step 1: same c</text>
    <text x="730" y="306">step 2: same c</text>
  </g>
  <text x="1020" y="240" fill="#C22B3F" font-size="12">BLEU 13.93 (max-len 30)</text>
  <text x="1020" y="258" fill="#C22B3F" font-size="12">BLEU 17.82 (max-len 50)</text>

  <rect x="48" y="332" width="1184" height="280" rx="10" fill="#101319" stroke="#04E762" stroke-width="1.2" filter="url(#vs-glow)"/>
  <text x="68" y="356" fill="#04E762" font-size="14">rnnsearch (attention) - fresh context each step</text>

  <g fill="url(#vs-steel)" stroke="#5A6270" stroke-width="1">
    <rect x="68" y="370" width="68" height="34" rx="4"/><text x="102" y="392" fill="#E8E6E3" font-size="10" text-anchor="middle">the</text>
    <rect x="142" y="370" width="68" height="34" rx="4"/><text x="176" y="392" fill="#E8E6E3" font-size="10" text-anchor="middle">man</text>
    <rect x="216" y="370" width="68" height="34" rx="4"/><text x="250" y="392" fill="#E8E6E3" font-size="10" text-anchor="middle">loves</text>
    <rect x="290" y="370" width="68" height="34" rx="4"/><text x="324" y="392" fill="#E8E6E3" font-size="10" text-anchor="middle">the</text>
    <rect x="364" y="370" width="68" height="34" rx="4"/><text x="398" y="392" fill="#E8E6E3" font-size="10" text-anchor="middle">dog</text>
    <rect x="438" y="370" width="68" height="34" rx="4"/><text x="472" y="392" fill="#7C8998" font-size="10" text-anchor="middle">EOS</text>
  </g>
  <text x="68" y="424" fill="#6E747D" font-size="10">encoder builds annotations. attention picks a different one each step.</text>

  <line x1="102" y1="404" x2="640" y2="448" stroke="#04E762" stroke-width="1.4" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="176" y1="404" x2="640" y2="448" stroke="#04E762" stroke-width="1.4" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="4s" begin="0.7s" repeatCount="indefinite"/>
  </line>
  <line x1="250" y1="404" x2="640" y2="448" stroke="#04E762" stroke-width="2.0" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="4s" begin="1.4s" repeatCount="indefinite"/>
  </line>
  <line x1="324" y1="404" x2="640" y2="448" stroke="#04E762" stroke-width="1.4" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="4s" begin="2.1s" repeatCount="indefinite"/>
  </line>
  <line x1="398" y1="404" x2="640" y2="448" stroke="#04E762" stroke-width="1.8" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="4s" begin="2.8s" repeatCount="indefinite"/>
  </line>
  <line x1="472" y1="404" x2="640" y2="448" stroke="#04E762" stroke-width="1.2" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="4s" begin="3.5s" repeatCount="indefinite"/>
  </line>

  <rect x="640" y="436" width="180" height="44" rx="6" fill="#0E8F52" stroke="#04E762" stroke-width="1.4" filter="url(#vs-glow)"/>
  <text x="730" y="462" fill="#E8E6E3" font-size="14" text-anchor="middle">c_i (fresh)</text>
  <text x="730" y="476" fill="#CFE7DD" font-size="9" text-anchor="middle">new vector each step</text>

  <rect x="880" y="436" width="180" height="44" rx="6" fill="#101319" stroke="#04E762" stroke-width="1.2"/>
  <text x="970" y="462" fill="#E8E6E3" font-size="13" text-anchor="middle">decoder gru</text>
  <line x1="820" y1="458" x2="880" y2="458" stroke="#04E762" stroke-width="1.4" marker-end="url(#vs-ag)"/>

  <text x="1020" y="460" fill="#04E762" font-size="12">BLEU 21.50 (max-len 30)</text>
  <text x="1020" y="478" fill="#04E762" font-size="12">BLEU 26.75 (max-len 50)</text>
  <text x="1020" y="496" fill="#04E762" font-size="12">BLEU 28.45 (max-len 50*)</text>

  <text x="48" y="624" fill="#6E747D" font-size="11">the 7.5+ bleu jump from rnnencdec-30 to rnnsearch-30 is the paper's result. attention gives the decoder a per-step window into the source. the baseline sees the whole sentence through one bottleneck.</text>
</g>
</svg>
