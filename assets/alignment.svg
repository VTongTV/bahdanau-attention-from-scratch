<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="align-t align-d">
<title id="align-t">alignment scoring with cached U_a h_j</title>
<desc id="align-d">the alignment model e_ij = v_a^T tanh(W_a s_{i-1} + U_a h_j). U_a h_j is precomputed once per source sentence, then reused at every decoder step. W_a s_{i-1} changes each step. the v_a vector scores the tanh. softmax over the source axis gives alpha.</desc>

<defs>
  <radialGradient id="align-bgA" cx="40%" cy="30%" r="85%"><stop offset="0%" stop-color="#15171C"/><stop offset="100%" stop-color="#08090C"/></radialGradient>
  <pattern id="align-gridA" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1B1F26"/></pattern>
  <linearGradient id="align-hbarA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#04E762"/><stop offset="100%" stop-color="#0A6B3F"/></linearGradient>
  <linearGradient id="align-steelA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3C424D"/><stop offset="100%" stop-color="#191C23"/></linearGradient>
  <radialGradient id="align-spotA" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#04E762" stop-opacity="0.85"/><stop offset="100%" stop-color="#04E762" stop-opacity="0"/></radialGradient>
  <filter id="align-glA" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="align-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8998"/></marker>
  <marker id="align-agA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#04E762"/></marker>
</defs>

<rect width="1000" height="620" fill="url(#align-bgA)"/>
<rect width="1000" height="620" fill="url(#align-gridA)"/>
<text x="40" y="36" fill="#E8E6E3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold">alignment scoring - cache U_a h_j, reuse across steps</text>
<text x="40" y="58" fill="#6E747D" font-family="Arial, Helvetica, sans-serif" font-size="12">tx * ty scores are computed per pair. U_a h_j happens once per source. only W_a s changes per step.</text>

<g font-family="Arial, Helvetica, sans-serif">
  <text x="80" y="92" fill="#7C8998" font-size="11">source annotations  h_j = [h_fwd_j ; h_bwd_j]  -  2n = 2000 each</text>
  <g stroke="#5A6270" stroke-width="1.2" fill="#161920">
    <rect x="80" y="100" width="60" height="44" rx="4"/>
    <rect x="150" y="100" width="60" height="44" rx="4"/>
    <rect x="220" y="100" width="60" height="44" rx="4"/>
    <rect x="290" y="100" width="60" height="44" rx="4"/>
    <rect x="360" y="100" width="60" height="44" rx="4"/>
    <rect x="430" y="100" width="60" height="44" rx="4"/>
  </g>
  <g fill="#E8E6E3" font-size="11" text-anchor="middle">
    <text x="110" y="126">h_1</text><text x="180" y="126">h_2</text><text x="250" y="126">h_3</text>
    <text x="320" y="126">h_4</text><text x="390" y="126">h_5</text><text x="460" y="126">h_6</text>
  </g>

  <text x="80" y="166" fill="#04E762" font-size="11">precompute once per source sentence, then reuse</text>
  <g stroke="#0A6B3F" stroke-width="1" fill="url(#align-hbarA)">
    <rect x="92" y="174" width="36" height="40" rx="3"/>
    <rect x="162" y="174" width="36" height="40" rx="3"/>
    <rect x="232" y="174" width="36" height="40" rx="3"/>
    <rect x="302" y="174" width="36" height="40" rx="3"/>
    <rect x="372" y="174" width="36" height="40" rx="3"/>
    <rect x="442" y="174" width="36" height="40" rx="3"/>
  </g>
  <g fill="#08090C" font-size="9" text-anchor="middle">
    <text x="110" y="198">U_a h_1</text><text x="180" y="198">U_a h_2</text><text x="250" y="198">U_a h_3</text>
    <text x="320" y="198">U_a h_4</text><text x="390" y="198">U_a h_5</text><text x="460" y="198">U_a h_6</text>
  </g>
  <g fill="#7C8998" font-size="9" text-anchor="middle">
    <text x="110" y="226">locked</text><text x="180" y="226">locked</text><text x="250" y="226">locked</text>
    <text x="320" y="226">locked</text><text x="390" y="226">locked</text><text x="460" y="226">locked</text>
  </g>

  <text x="600" y="92" fill="#7C8998" font-size="11">decoder state  s_{i-1}  -  n = 1000  -  changes every step</text>
  <rect x="600" y="100" width="180" height="44" rx="6" fill="url(#align-steelA)" stroke="#04E762" stroke-width="1.2" filter="url(#align-glA)"/>
  <text x="690" y="126" fill="#E8E6E3" font-size="13" text-anchor="middle">s_{i-1}</text>
  <rect x="600" y="100" width="180" height="44" rx="6" fill="#04E762" opacity="0">
    <animate attributeName="opacity" values="0;0.25;0.25;0" keyTimes="0;0.08;0.92;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="790" y="126" fill="#04E762" font-size="9">flows this step</text>

  <text x="600" y="166" fill="#04E762" font-size="11">W_a s_{i-1}  -  new each step, never cached</text>
  <rect x="612" y="174" width="180" height="40" rx="4" fill="#0E8F52" stroke="#04E762" stroke-width="1.2"/>
  <text x="702" y="198" fill="#E8E6E3" font-size="13" text-anchor="middle">W_a s_{i-1}</text>

  <text x="80" y="248" fill="#6E747D" font-size="10">add: tanh( W_a s_{i-1} + U_a h_j )  -  shape n' = 1000  -  one row per source word</text>
  <g stroke="#3A4049" stroke-width="1" fill="url(#align-steelA)">
    <rect x="80" y="258" width="60" height="50" rx="3"/>
    <rect x="150" y="258" width="60" height="50" rx="3"/>
    <rect x="220" y="258" width="60" height="50" rx="3"/>
    <rect x="290" y="258" width="60" height="50" rx="3"/>
    <rect x="360" y="258" width="60" height="50" rx="3"/>
    <rect x="430" y="258" width="60" height="50" rx="3"/>
  </g>
  <g fill="#7C8998" font-size="9" text-anchor="middle">
    <text x="110" y="287">tanh_1</text><text x="180" y="287">tanh_2</text><text x="250" y="287">tanh_3</text>
    <text x="320" y="287">tanh_4</text><text x="390" y="287">tanh_5</text><text x="460" y="287">tanh_6</text>
  </g>

  <circle cx="250" cy="283" r="56" fill="url(#align-spotA)" opacity="0">
    <animate attributeName="opacity" values="0;0.95;0.95;0.95;0" keyTimes="0;0.12;0.5;0.92;1" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="110;180;250;320;390;460;110" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="3s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="248" fill="#6E747D" font-size="10">W_a s_{i-1} broadcasts, adds to each cached U_a h_j</text>
  <line x1="690" y1="214" x2="690" y2="258" stroke="#04E762" stroke-width="1.4" opacity="0.8"/>
  <line x1="690" y1="258" x2="490" y2="258" stroke="#04E762" stroke-width="1.4" opacity="0.8" stroke-dasharray="3 4"/>
  <g stroke="#04E762" stroke-width="1" opacity="0.6" stroke-dasharray="2 3">
    <line x1="110" y1="214" x2="110" y2="258"/>
    <line x1="180" y1="214" x2="180" y2="258"/>
    <line x1="250" y1="214" x2="250" y2="258"/>
    <line x1="320" y1="214" x2="320" y2="258"/>
    <line x1="390" y1="214" x2="390" y2="258"/>
    <line x1="460" y1="214" x2="460" y2="258"/>
  </g>

  <text x="80" y="332" fill="#04E762" font-size="11">v_a^T scores every row -> e_ij scalar per (i, j)</text>
  <g stroke="#0A6B3F" stroke-width="1" fill="url(#align-hbarA)">
    <rect x="84" y="342" width="52" height="0"><animate attributeName="height" values="20;6;14;4;24;10;20" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="342;356;348;358;338;352;342" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="154" y="342" width="52" height="0"><animate attributeName="height" values="6;22;4;20;6;16;6" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="356;340;354;342;356;346;356" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="224" y="342" width="52" height="0"><animate attributeName="height" values="24;8;20;6;22;4;24" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="338;354;340;356;338;358;338" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="294" y="342" width="52" height="0"><animate attributeName="height" values="10;16;6;22;4;20;10" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="352;346;356;340;358;342;352" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="364" y="342" width="52" height="0"><animate attributeName="height" values="4;24;8;10;26;6;4" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="358;338;354;352;336;356;358" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="434" y="342" width="52" height="0"><animate attributeName="height" values="16;4;24;8;18;2;16" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="346;358;338;354;344;360;346" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
  </g>
  <line x1="80" y1="370" x2="490" y2="370" stroke="#3A4049" stroke-width="0.8"/>
  <g fill="#6E747D" font-size="9" text-anchor="middle">
    <text x="110" y="386">e_1</text><text x="180" y="386">e_2</text><text x="250" y="386">e_3</text>
    <text x="320" y="386">e_4</text><text x="390" y="386">e_5</text><text x="460" y="386">e_6</text>
  </g>

  <text x="600" y="332" fill="#04E762" font-size="11">softmax across source axis -> alpha_ij</text>
  <g stroke="#0A6B3F" stroke-width="1" fill="url(#align-hbarA)">
    <rect x="608" y="342" width="52" height="0"><animate attributeName="height" values="6;22;4;20;6;16;6" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="356;340;354;342;356;346;356" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="668" y="342" width="52" height="0"><animate attributeName="height" values="10;6;22;4;20;8;10" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="352;356;340;358;342;354;352" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="728" y="342" width="52" height="0"><animate attributeName="height" values="4;24;10;6;22;8;4" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="358;338;352;356;340;354;358" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="788" y="342" width="52" height="0"><animate attributeName="height" values="22;8;18;4;24;6;22" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="340;354;344;358;338;356;340" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="848" y="342" width="52" height="0"><animate attributeName="height" values="6;16;4;22;8;20;6" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="356;346;358;340;354;342;356" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="908" y="342" width="52" height="0"><animate attributeName="height" values="4;10;6;20;8;22;4" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="358;352;356;342;354;340;358" keyTimes="0;0.16;0.32;0.48;0.58;0.74;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
  </g>
  <line x1="606" y1="370" x2="960" y2="370" stroke="#3A4049" stroke-width="0.8"/>
  <text x="610" y="386" fill="#6E747D" font-size="9">sums to 1, spotlight grades each source word</text>

  <text x="40" y="420" fill="#E8E6E3" font-size="14" font-weight="bold">why this matters</text>
  <text x="40" y="442" fill="#7C8998" font-size="12">- tx source positions, ty decoder steps. naive recomputation is tx*ty*d' matmuls.</text>
  <text x="40" y="462" fill="#7C8998" font-size="12">- caching U_a h_j drops that to tx matmuls once, plus ty cheap adds and dot products.</text>
  <text x="40" y="482" fill="#7C8998" font-size="12">- the dashed feed from W_a s_{i-1} is the only per-step cost. the green boxes stay locked.</text>
  <text x="40" y="502" fill="#7C8998" font-size="12">- at decode time the same cache carries over. the encoder runs once, then beam steps.</text>

  <text x="40" y="528" fill="#E8E6E3" font-size="14" font-weight="bold">shapes</text>
  <text x="40" y="550" fill="#6E747D" font-size="12">- W_a : n' x n     - U_a : n' x 2n    - v_a : n'    - alpha : ty x tx    - c : ty x 2n</text>
  <text x="40" y="572" fill="#6E747D" font-size="12">- n = 1000, n' = 1000 (ALIGNMENT_HIDDEN), 2n annotation dim</text>
  <text x="40" y="594" fill="#6E747D" font-size="12">- c_i = sum_j alpha_ij h_j  -  contexts feed the decoder, one per step</text>

  <line x1="490" y1="370" x2="600" y2="350" stroke="#04E762" stroke-width="1.4" opacity="0.7" marker-end="url(#align-agA)"/>
</g>
</svg>
