    <rect x="1124" y="348" width="100" height="22" rx="3" fill="#04E762" opacity="0"><animate attributeName="opacity" values="0;0.95" keyTimes="0;1" begin="1.34s" dur="0.1s" fill="freeze"/><animate attributeName="opacity" values="0.95;0.95;0" keyTimes="0;0.9;1" begin="1.34s" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="1124" y="376" width="100" height="22" rx="3" fill="#04E762" opacity="0"><animate attributeName="opacity" values="0;0.95" keyTimes="0;1" begin="1.41s" dur="0.1s" fill="freeze"/><animate attributeName="opacity" values="0.95;0.95;0" keyTimes="0;0.9;1" begin="1.41s" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="1124" y="404" width="100" height="22" rx="3" fill="#04E762" opacity="0"><animate attributeName="opacity" values="0;0.95" keyTimes="0;1" begin="1.48s" dur="0.1s" fill="freeze"/><animate attributeName="opacity" values="0.95;0.95;0" keyTimes="0;0.9;1" begin="1.48s" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="1124" y="432" width="100" height="22" rx="3" fill="#04E762" opacity="0"><animate attributeName="opacity" values="0;0.95" keyTimes="0;1" begin="1.55s" dur="0.1s" fill="freeze"/><animate attributeName="opacity" values="0.95;0.95;0" keyTimes="0;0.9;1" begin="1.55s" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="1124" y="460" width="100" height="22" rx="3" fill="#04E762" opacity="0"><animate attributeName="opacity" values="0;0.95" keyTimes="0;1" begin="1.62s" dur="0.1s" fill="freeze"/><animate attributeName="opacity" values="0.95;0.95;0" keyTimes="0;0.9;1" begin="1.62s" dur="6s" repeatCount="indefinite"/></rect>
