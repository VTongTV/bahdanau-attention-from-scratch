<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="attn-t attn-d">
<title id="attn-t">attention heatmap - alpha_ij across decoder steps and source words</title>
<desc id="attn-d">the alpha_ij matrix: rows are decoder steps, columns are source words. each row sums to 1 over valid source positions. padded source positions are masked to zero, never receive attention. a downward reading line marks the live decoder step. brighter cells mean more attention at that step on that source word.</desc>

<defs>
  <radialGradient id="attn-bgM" cx="40%" cy="30%" r="85%"><stop offset="0%" stop-color="#15171C"/><stop offset="100%" stop-color="#08090C"/></radialGradient>
  <pattern id="attn-gridM" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1B1F26"/></pattern>
  <linearGradient id="attn-barMG" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#0A6B3F"/><stop offset="100%" stop-color="#04E762"/></linearGradient>
  <filter id="attn-glM" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="attn-arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8998"/></marker>
</defs>

<rect width="1000" height="640" fill="url(#attn-bgM)"/>
<rect width="1000" height="640" fill="url(#attn-gridM)"/>
<text x="40" y="36" fill="#E8E6E3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold">attention heatmap - alpha_ij, masked softmax</text>
<text x="40" y="58" fill="#6E747D" font-family="Arial, Helvetica, sans-serif" font-size="12">rows are decoder steps y_i. columns are source words x_j. brighter = more attention. padded columns stay cold.</text>

<g font-family="Arial, Helvetica, sans-serif">
  <text x="80" y="92" fill="#7C8998" font-size="11">source words</text>
  <g fill="#E8E6E3" font-size="11" text-anchor="middle">
    <text x="110" y="110">the</text><text x="180" y="110">man</text><text x="250" y="110">loves</text>
    <text x="320" y="110">the</text><text x="390" y="110">dog</text><text x="460" y="110"></text>
    <text x="530" y="110">＜PAD＞</text><text x="600" y="110">＜PAD＞</text>
  </g>

  <text x="40" y="142" fill="#7C8998" font-size="10">decoder steps y_i</text>

  <g>
    <rect x="80" y="124" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.92"/>
    <rect x="150" y="124" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.10"/>
    <rect x="220" y="124" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.04"/>
    <rect x="290" y="124" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.06"/>
    <rect x="360" y="124" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.05"/>
    <rect x="430" y="124" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.30"/>
    <rect x="500" y="124" width="70" height="46" rx="2" fill="#2A2E35"/>
    <rect x="570" y="124" width="70" height="46" rx="2" fill="#2A2E35"/>
  </g>

  <g>
    <rect x="80" y="172" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.18"/>
    <rect x="150" y="172" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.80"/>
    <rect x="220" y="172" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.06"/>
    <rect x="290" y="172" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.04"/>
    <rect x="360" y="172" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.04"/>
    <rect x="430" y="172" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.10"/>
    <rect x="500" y="172" width="70" height="46" rx="2" fill="#2A2E35"/>
    <rect x="570" y="172" width="70" height="46" rx="2" fill="#2A2E35"/>
  </g>

  <g>
    <rect x="80" y="220" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.05"/>
    <rect x="150" y="220" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.10"/>
    <rect x="220" y="220" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.86"/>
    <rect x="290" y="220" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.04"/>
    <rect x="360" y="220" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.04"/>
    <rect x="430" y="220" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.12"/>
    <rect x="500" y="220" width="70" height="46" rx="2" fill="#2A2E35"/>
    <rect x="570" y="220" width="70" height="46" rx="2" fill="#2A2E35"/>
  </g>

  <g>
    <rect x="80" y="268" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.06"/>
    <rect x="150" y="268" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.12"/>
    <rect x="220" y="268" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.18"/>
    <rect x="290" y="268" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.83"/>
    <rect x="360" y="268" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.06"/>
    <rect x="430" y="268" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.12"/>
    <rect x="500" y="268" width="70" height="46" rx="2" fill="#2A2E35"/>
    <rect x="570" y="268" width="70" height="46" rx="2" fill="#2A2E35"/>
  </g>

  <g>
    <rect x="80" y="316" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.08"/>
    <rect x="150" y="316" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.10"/>
    <rect x="220" y="316" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.14"/>
    <rect x="290" y="316" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.16"/>
    <rect x="360" y="316" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.40"/>
    <rect x="430" y="316" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.55"/>
    <rect x="500" y="316" width="70" height="46" rx="2" fill="#2A2E35"/>
    <rect x="570" y="316" width="70" height="46" rx="2" fill="#2A2E35"/>
  </g>

  <g>
    <rect x="80" y="364" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.05"/>
    <rect x="150" y="364" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.05"/>
    <rect x="220" y="364" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.08"/>
    <rect x="290" y="364" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.10"/>
    <rect x="360" y="364" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.10"/>
    <rect x="430" y="364" width="70" height="46" rx="2" fill="#04E762" fill-opacity="0.88"/>
    <rect x="500" y="364" width="70" height="46" rx="2" fill="#2A2E35"/>
    <rect x="570" y="364" width="70" height="46" rx="2" fill="#2A2E35"/>
  </g>

  <line x1="78" y1="170" x2="640" y2="170" stroke="#04E762" stroke-width="2" opacity="0.85" filter="url(#attn-glM)">
    <animate attributeName="y1" values="170;218;266;314;362;410;170" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="170;218;266;314;362;410;170" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="4.5s" repeatCount="indefinite"/>
  </line>

  <g fill="#7C8998" font-size="11" text-anchor="end">
    <text x="76" y="151">je</text><text x="76" y="199">aime</text><text x="76" y="247">les</text>
    <text x="76" y="295">chiens</text><text x="76" y="343">beaucoup</text><text x="76" y="391"></text>
  </g>

  <g stroke="#3A4049" stroke-width="0.8" fill="none">
    <rect x="80" y="124" width="490" height="290"/>
    <rect x="80" y="124" width="70" height="46"/>
    <rect x="150" y="124" width="70" height="46"/>
    <rect x="220" y="124" width="70" height="46"/>
    <rect x="290" y="124" width="70" height="46"/>
    <rect x="360" y="124" width="70" height="46"/>
    <rect x="430" y="124" width="70" height="46"/>
    <rect x="500" y="124" width="70" height="46"/>
    <rect x="570" y="124" width="70" height="46"/>
  </g>

  <text x="80" y="446" fill="#7C8998" font-size="11">each row sums to 1 over columns 1..6. columns 7..8 are ＜PAD＞, masked to -inf before softmax.</text>

  <text x="700" y="92" fill="#7C8998" font-size="11">row sums</text>
  <g stroke="#0A6B3F" stroke-width="0.8">
    <rect x="700" y="100" width="240" height="0"><animate attributeName="width" values="240;240;240;240;240;240;240" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="4.5s" repeatCount="indefinite"/></rect>
  </g>
  <g stroke="#3A4049" stroke-width="0.8">
    <line x1="700" y1="100" x2="700" y2="410" stroke-dasharray="2 4"/>
    <line x1="940" y1="100" x2="940" y2="410" stroke-dasharray="2 4"/>
    <line x1="700" y1="100" x2="940" y2="100" stroke-dasharray="2 4"/>
  </g>
  <g fill="url(#attn-barMG)" stroke="#0A6B3F" stroke-width="0.8">
    <rect x="700" y="160" width="240" height="14"/>
    <rect x="700" y="208" width="240" height="14"/>
    <rect x="700" y="256" width="240" height="14"/>
    <rect x="700" y="304" width="240" height="14"/>
    <rect x="700" y="352" width="240" height="14"/>
    <rect x="700" y="400" width="240" height="14"/>
  </g>
  <text x="946" y="100" fill="#6E747D" font-size="9">1.0</text>
  <text x="700" y="100" fill="#6E747D" font-size="9">0</text>
  <text x="710" y="446" fill="#7C8998" font-size="11">all bars stay at 1.0. masking keeps padding mass at zero.</text>

  <line x1="640" y1="170" x2="700" y2="160" stroke="#04E762" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>

  <text x="40" y="484" fill="#E8E6E3" font-size="14" font-weight="bold">what you should see</text>
  <text x="40" y="506" fill="#7C8998" font-size="12">- a near-diagonal stripe at first: the man->je, loves->aime cases of monotonic alignment.</text>
  <text x="40" y="526" fill="#7C8998" font-size="12">- mild reordering: english "the dog" -> french placed later, the bright column shifts right.</text>
  <text x="40" y="546" fill="#7C8998" font-size="12">- attention on the end token is diffuse: the last row waits for ＜/s＞, splits across neighbors.</text>
  <text x="40" y="566" fill="#7C8998" font-size="12">- the two pad columns stay coal-black at every step. softmax never leaks mass there.</text>

  <text x="40" y="594" fill="#E8E6E3" font-size="13" fill-opacity="0">read-out: alpha is part of the model, not a post-hoc probe. the heatmap shows what the cell learned to look at.</text>
  <text x="40" y="624" fill="#6E747D" font-size="12">read-out: alpha is part of the model, not a probe. the heatmap shows what the decoder learned to look at.</text>
</g>
</svg>
