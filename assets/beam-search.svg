<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="bs-t bs-d">
<title id="bs-t">beam search - width 10 with eos pruning</title>
<desc id="bs-d">a beam search of width 10. at each step every hypothesis branches. the moment one emits the end token it freezes and stops growing. candidates rank by log-probability. the top ten survive at each step.</desc>

<defs>
  <radialGradient id="bs-bg" cx="40%" cy="30%" r="85%"><stop offset="0%" stop-color="#15171C"/><stop offset="100%" stop-color="#08090C"/></radialGradient>
  <pattern id="bs-grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1B1F26"/></pattern>
  <linearGradient id="bs-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3C424D"/><stop offset="100%" stop-color="#191C23"/></linearGradient>
  <linearGradient id="bs-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#04E762"/><stop offset="100%" stop-color="#0A6B3F"/></linearGradient>
  <linearGradient id="bs-frozen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5A6270"/><stop offset="100%" stop-color="#3A4049"/></linearGradient>
  <filter id="bs-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="bs-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5A6270"/></marker>
  <marker id="bs-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#04E762"/></marker>
</defs>

<rect width="1280" height="640" fill="url(#bs-bg)"/>
<rect width="1280" height="640" fill="url(#bs-grid)"/>
<text x="48" y="38" fill="#E8E6E3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold">beam search - width 10, log-prob ranks the hypotheses</text>
<text x="48" y="60" fill="#6E747D" font-family="Arial, Helvetica, sans-serif" font-size="12">four steps shown. each step the frontier branches. the moment a node emits the end token it freezes (greys out, never branches again). top 10 scores survive.</text>

<g font-family="Arial, Helvetica, sans-serif">
  <text x="48" y="92" fill="#6E747D" font-size="11">step 0: one bos root</text>
  <text x="240" y="92" fill="#6E747D" font-size="11">step 1: 10 branches from bos</text>
  <text x="500" y="92" fill="#6E747D" font-size="11">step 2: top 10 survive, 1 hits eos</text>
  <text x="800" y="92" fill="#6E747D" font-size="11">step 3: 8 active + 2 frozen</text>
  <text x="1060" y="92" fill="#6E747D" font-size="11">step 4: champion path</text>

  <rect x="60" y="104" width="1160" height="1" fill="#3A4049" opacity="0.5"/>
  <rect x="60" y="224" width="1160" height="1" fill="#3A4049" opacity="0.5"/>
  <rect x="60" y="344" width="1160" height="1" fill="#3A4049" opacity="0.5"/>
  <rect x="60" y="464" width="1160" height="1" fill="#3A4049" opacity="0.5"/>

  <rect x="600" y="110" width="90" height="36" rx="6" fill="url(#bs-steel)" stroke="#5A6270"/>
  <text x="645" y="133" fill="#E8E6E3" font-size="12" text-anchor="middle">bos</text>

  <g stroke="#5A6270" stroke-width="1" fill="none" opacity="0.4">
    <line x1="620" y1="146" x2="110" y2="230"/>
    <line x1="625" y1="146" x2="220" y2="230"/>
    <line x1="630" y1="146" x2="330" y2="230"/>
    <line x1="635" y1="146" x2="440" y2="230"/>
    <line x1="640" y1="146" x2="550" y2="230"/>
    <line x1="645" y1="146" x2="660" y2="230"/>
    <line x1="650" y1="146" x2="770" y2="230"/>
    <line x1="655" y1="146" x2="880" y2="230"/>
    <line x1="660" y1="146" x2="990" y2="230"/>
    <line x1="665" y1="146" x2="1100" y2="230"/>
  </g>

  <g fill="url(#bs-bar)" stroke="#0A6B3F" stroke-width="0.8">
    <rect x="80" y="230" width="80" height="32" rx="5"/>
    <rect x="190" y="230" width="80" height="32" rx="5"/>
    <rect x="300" y="230" width="80" height="32" rx="5"/>
    <rect x="410" y="230" width="80" height="32" rx="5"/>
    <rect x="520" y="230" width="80" height="32" rx="5"/>
    <rect x="630" y="230" width="80" height="32" rx="5"/>
    <rect x="740" y="230" width="80" height="32" rx="5"/>
    <rect x="850" y="230" width="80" height="32" rx="5"/>
    <rect x="960" y="230" width="80" height="32" rx="5"/>
    <rect x="1070" y="230" width="80" height="32" rx="5"/>
  </g>
  <g fill="#08090C" font-size="9" text-anchor="middle">
    <text x="120" y="250">je</text><text x="230" y="250">le</text><text x="340" y="250">un</text>
    <text x="450" y="250">la</text><text x="560" y="250">il</text><text x="670" y="250">nous</text>
    <text x="780" y="250">tu</text><text x="890" y="250">ce</text><text x="1000" y="250">elle</text>
    <text x="1110" y="250">on</text>
  </g>
  <g fill="#6E747D" font-size="8" text-anchor="middle">
    <text x="120" y="272">-0.12</text><text x="230" y="272">-0.14</text><text x="340" y="272">-0.15</text>
    <text x="450" y="272">-0.16</text><text x="560" y="272">-0.17</text><text x="670" y="272">-0.18</text>
    <text x="780" y="272">-0.19</text><text x="890" y="272">-0.20</text><text x="1000" y="272">-0.21</text>
    <text x="1110" y="272">-0.22</text>
  </g>

  <g stroke="#5A6270" stroke-width="0.8" fill="none" opacity="0.35">
    <line x1="120" y1="262" x2="120" y2="350"/>
    <line x1="230" y1="262" x2="230" y2="350"/>
    <line x1="340" y1="262" x2="340" y2="350"/>
    <line x1="450" y1="262" x2="450" y2="350"/>
    <line x1="560" y1="262" x2="560" y2="350"/>
    <line x1="670" y1="262" x2="670" y2="350"/>
    <line x1="780" y1="262" x2="780" y2="350"/>
    <line x1="890" y1="262" x2="890" y2="350"/>
    <line x1="1000" y1="262" x2="1000" y2="350"/>
    <line x1="1110" y1="262" x2="1110" y2="350"/>
  </g>

  <g fill="url(#bs-bar)" stroke="#0A6B3F" stroke-width="0.8">
    <rect x="80" y="350" width="80" height="32" rx="5"/>
    <rect x="190" y="350" width="80" height="32" rx="5"/>
    <rect x="300" y="350" width="80" height="32" rx="5"/>
    <rect x="410" y="350" width="80" height="32" rx="5"/>
    <rect x="520" y="350" width="80" height="32" rx="5"/>
    <rect x="630" y="350" width="80" height="32" rx="5"/>
    <rect x="740" y="350" width="80" height="32" rx="5"/>
    <rect x="850" y="350" width="80" height="32" rx="5"/>
  </g>
  <g fill="#08090C" font-size="9" text-anchor="middle">
    <text x="120" y="370">je aime</text><text x="230" y="370">le chien</text><text x="340" y="370">un chat</text>
    <text x="450" y="370">la femme</text><text x="560" y="370">il est</text><text x="670" y="370">nous sommes</text>
    <text x="780" y="370">tu es</text><text x="890" y="370">ce est</text>
  </g>

  <rect x="960" y="350" width="80" height="32" rx="5" fill="url(#bs-frozen)" stroke="#5A6270" stroke-width="1"/>
  <text x="1000" y="370" fill="#7C8998" font-size="9" text-anchor="middle">elle EOS</text>
  <text x="1000" y="392" fill="#C22B3F" font-size="8" text-anchor="middle">FROZEN</text>

  <rect x="1070" y="350" width="80" height="32" rx="5" fill="url(#bs-frozen)" stroke="#5A6270" stroke-width="1"/>
  <text x="1110" y="370" fill="#7C8998" font-size="9" text-anchor="middle">on EOS</text>
  <text x="1110" y="392" fill="#C22B3F" font-size="8" text-anchor="middle">FROZEN</text>

  <g stroke="#5A6270" stroke-width="0.8" fill="none" opacity="0.35">
    <line x1="120" y1="382" x2="120" y2="470"/>
    <line x1="230" y1="382" x2="230" y2="470"/>
    <line x1="340" y1="382" x2="340" y2="470"/>
    <line x1="450" y1="382" x2="450" y2="470"/>
    <line x1="560" y1="382" x2="560" y2="470"/>
    <line x1="670" y1="382" x2="670" y2="470"/>
    <line x1="780" y1="382" x2="780" y2="470"/>
    <line x1="890" y1="382" x2="890" y2="470"/>
  </g>

  <g fill="url(#bs-bar)" stroke="#0A6B3F" stroke-width="0.8">
    <rect x="80" y="470" width="80" height="32" rx="5"/>
    <rect x="190" y="470" width="80" height="32" rx="5"/>
    <rect x="300" y="470" width="80" height="32" rx="5"/>
    <rect x="410" y="470" width="80" height="32" rx="5"/>
    <rect x="520" y="470" width="80" height="32" rx="5"/>
    <rect x="630" y="470" width="80" height="32" rx="5"/>
    <rect x="740" y="470" width="80" height="32" rx="5"/>
    <rect x="850" y="470" width="80" height="32" rx="5"/>
  </g>
  <g fill="#08090C" font-size="9" text-anchor="middle">
    <text x="120" y="490">je aime les</text><text x="230" y="490">le chien est</text><text x="340" y="490">un chat noir</text>
    <text x="450" y="490">la femme a</text><text x="560" y="490">il est le</text><text x="670" y="490">nous sommes...</text>
    <text x="780" y="490">tu es un</text><text x="890" y="490">ce est le</text>
  </g>

  <g fill="#6E747D" font-size="8" text-anchor="middle">
    <text x="120" y="512">-0.31</text><text x="230" y="512">-0.33</text><text x="340" y="512">-0.35</text>
    <text x="450" y="512">-0.37</text><text x="560" y="512">-0.39</text><text x="670" y="512">-0.41</text>
    <text x="780" y="512">-0.43</text><text x="890" y="512">-0.45</text>
  </g>

  <rect x="80" y="470" width="80" height="32" rx="5" fill="#04E762" opacity="0" filter="url(#bs-glow)">
    <animate attributeName="opacity" values="0;0.3;0.3;0" keyTimes="0;0.08;0.92;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="48" y="556" fill="#E8E6E3" font-size="14" font-weight="bold">how it works</text>
  <text x="48" y="578" fill="#7C8998" font-size="12">- at each step, every active hypothesis expands with every word in the shortlist (30 000 branches each).</text>
  <text x="48" y="598" fill="#7C8998" font-size="12">- rank by log-prob of the sequence. keep the top 10. the moment a path emits eos, it is done (frozen).</text>
  <text x="48" y="618" fill="#7C8998" font-size="12">- unk suppress: when the flag is on, never emit the unk token during no-unk evaluation.</text>
  <text x="48" y="638" fill="#6E747D" font-size="11">width=10 is the default. the champion path is the one with the highest log-prob when all beams have emitted eos or hit max_len.</text>
</g>
</svg>
