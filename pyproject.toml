[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nmt"
version = "0.1.0"
description = "neural machine translation by jointly learning to align and translate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "tqdm>=4.60",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nmt-train = "nmt.cli:train"
nmt-translate = "nmt.cli:translate"
nmt-eval = "nmt.cli:evaluate"

[tool.setuptools.packages.find]
include = ["nmt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]